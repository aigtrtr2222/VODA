 "faction": "의열투쟁", "award": "애족장", "defYear": "", "defType": "", "note": "의열단 창립 단원 — 최수봉 포섭. 1990 애족장(창립단원 중 유일 5등급 — 유족 상향 요구 중). 공훈록 몰년 1927.10.19이나 일본 요시찰 기록 근거 생존설 논쟁", "bio": "신흥무관학교를 거쳐 의열단 창립 단원 10인에 포함되었다. 1920년 최수봉을 포섭해 밀양경찰서 투탄의 연결 고리가 되었다."}, {"id": "P132", "name": "한봉근", "aliases": "", "birth": "1894", "death": "1958", "birthplace": "경남 밀양", "faction": "의열투쟁", "award": "독립장", "defYear": "", "defType": "", "note": "의열단 창립 단원 — 나석주 의거 참여. 1980 독립장. 공훈록 생몰 1894-1958(위키 1927몰은 공식DB와 상충)", "bio": "의열단 창단에 참여한 창립 단원으로 신흥무관학교 출신이다. 동생 한봉인과 함께 활동했고, 1923년 재편 시 기밀부원으로 활동했다."}, {"id": "P133", "name": "김대지", "aliases": "", "birth": "1891", "death": "1943", "birthplace": "경남 밀양", "faction": "의열투쟁", "award": "독립장", "defYear": "", "defType": "", "note": "의열단 고문. 1980 독립장. 몰년 1943(인명사전 음 10.26 — 공훈록 1942와 이설 병기)", "bio": "밀양 출신. 1913년경 일합사를 결성했고, 1919년 임시의정원 의원·임정 내무위원을 지내며 의열단 창단을 지도했다. 1920년 제1차 국내 거사를 지원했고 1923~25년 김원봉의 고문역을 맡았다."}, {"id": "P134", "name": "김시현", "aliases": "학우", "birth": "1883", "death": "1966", "birthplace": "경북 안동", "faction": "의열투쟁", "award": "미서훈", "defYear": "", "defType": "", "note": "황옥 사건 주도 — 1952년 사건으로 미서훈", "bio": "3·1운동 후 길림 망명, 의열단에 입단했다. 1923년 제2차 암살파괴계획(황옥 경부 폭탄사건)을 국내에서 주도하다 피체되어 징역 10년을 받았다. 해방 후 1952년 이승만 저격 사건 관련 유죄로 서훈에서 제외됐다."}, {"id": "P135", "name": "황옥", "aliases": "", "birth": "1885", "death": "", "birthplace": "", "faction": "기타", "award": "미서훈", "defYear": "", "defType": "논란(미확정)", "note": "경기도경찰부 경부 — 밀정 여부 논쟁", "bio": "경기도경찰부 경부로 재직 중 김시현과 접선, 1923년 톈진에서 김원봉에게 폭탄 36개·권총 5정을 받아 서울로 반입했다. 밀고로 발각되어 12년형. 진성 협력자인지 일제 밀정인지 논쟁이 계속된다."}, {"id": "P136", "name": "김한", "aliases": "", "birth": "1888", "death": "1938", "birthplace": "서울", "faction": "사회주의", "award": "독립장", "defYear": "", "defType": "", "note": "의열단 국내 연락 — 2005 서훈", "bio": "초기 사회주의 운동가로 의열단 국내 연락과 폭탄 수수를 맡기로 했다가 김상옥 의거 직후 검거되어 징역 6년을 받았다. 1930년 소련행, 1938년 대숙청기에 처형됐다. 2005년 건국훈장 독립장."}, {"id": "P137", "name": "이태준", "aliases": "대암", "birth": "1883", "death": "1921", "birthplace": "경남 함안", "faction": "기타", "award": "애족장", "defYear": "", "defType": "", "note": "몽골 '동의의국' 의사 — 의열단 지원 · 애족장 1990(공훈록 1894)", "bio": "세브란스의학교 출신 의사. 몽골 고륜에 동의의국을 열어 러-중을 오가는 혁명인사들의 연락·은신·자금운송 중계 거점으로 삼았고 몽골 국왕 훈장을 받았다. 김규식의 파리행 여비 2,000달러를 댔고, 폭탄기술자 마자르를 김원봉에게 소개하려다 1921년 운게른 백군에게 교살당했다(반병률 2019)."}, {"id": "P138", "name": "김홍일", "aliases": "왕웅;일서", "birth": "1898", "death": "1980", "birthplace": "평북 용천", "faction": "임시정부", "award": "독립장", "defYear": "", "defType": "", "note": "상해병공창 — 이봉창·윤봉길 폭탄 제작", "bio": "상해병공창 군기처 주임으로 김구의 요청에 따라 이봉창·윤봉길 의거용 폭탄을 제작·제공했다. 중국군 장성을 거쳐 광복 후 국군 장성·외무장관을 지냈다."}, {"id": "P139", "name": "유상근", "aliases": "", "birth": "1910", "death": "1945", "birthplace": "강원 통천", "faction": "의열투쟁", "award": "독립장", "defYear": "", "defType": "", "note": "다롄 의거 — 광복 전날 옥중 순국", "bio": "1932년 김구의 지령으로 한인애국단원으로 다롄에 파견되어 관동군사령관 등 폭살을 준비하다 발각·피체됐다. 무기징역 복역 중 광복 하루 전 옥중 순국했다."}, {"id": "P140", "name": "최흥식", "aliases": "", "birth": "1909", "death": "1932", "birthplace": "서울", "faction": "의열투쟁", "award": "애국장", "defYear": "", "defType": "", "note": "다롄 의거", "bio": "인쇄소 견습공 출신으로 이봉창 의거 후 한인애국단에 입단했다. 다롄에서 국제연맹조사단 접견 일제 고관 처단을 준비하던 중 김구에게 보낸 편지가 발각되어 피체됐다."}, {"id": "P141", "name": "이덕주", "aliases": "", "birth": "1908", "death": "1935", "birthplace": "황해 신천", "faction": "의열투쟁", "award": "애국장", "defYear": "", "defType": "", "note": "총독 처단 국내 파견 — 해주형무소 옥사 · 생년 이설: 통설 1908 vs 공훈록 1911.1.2", "bio": "1926년 중국 망명 후 김구와 함께 활동했다. 1932년 조선총독 처단 지령을 받고 권총을 소지하고 국내 잠입했다가 피체되어 7년형, 해주형무소에서 옥사했다."}, {"id": "P142", "name": "이화림", "aliases": "리화림", "birth": "1906", "death": "", "birthplace": "평양", "faction": "의열투쟁", "award": "미서훈", "defYear": "", "defType": "", "note": "한인애국단→조선의용대 부녀복무단 — 미서훈. 훙커우 동행·검문 통과 지원은 본인 회고록 기반(언론 기획 동일 계열) — 1차 사료 미확인", "bio": "1930년 상해 망명 후 김구가 이끄는 애국단에 가담했다. 1939년 조선의용대 부녀복무단 부대장으로 화북에서 활동했다. 훙커우 의거 지원설은 본인 회고에 근거한다."}, {"id": "P143", "name": "안정근", "aliases": "", "birth": "1885", "death": "1949", "birthplace": "황해 신천", "faction": 의용대 회고록을 남겼다."}, {"id": "P150", "name": "홍진", "aliases": "홍면희;만오", "birth": "1877", "death": "1946", "birthplace": "충북 영동", "faction": "임시정부", "award": "독립장", "defYear": "", "defType": "", "note": "국무령(1926) — 계보 이상룡→홍진→김구", "bio": "검사 출신 법률가. 한성임시정부 수립에 참여하고 상해로 망명해 법무총장을 지냈다. 1926년 국무령에 취임했으나 약 5개월 만에 사임했고, 이후 임시의정원 의장과 광복군 창설 참여로 임정을 지켰다."}, {"id": "P151", "name": "차리석", "aliases": "동암;서입환;차이석", "birth": "1881", "death": "1945", "birthplace": "평북 선천", "faction": "임시정부", "award": "독립장", "defYear": "", "defType": "", "note": "'임정의 파수꾼' — 비서장 · 공훈록 표기 차이석(車利錫), 독립장 1962(10304)", "bio": "신민회 회원 출신. 1922년부터 임시의정원 의원, 1930년 부의장, 1933년 국무위원. 1935년 임정 존폐 위기 때 송병조와 함께 정부를 사수했고 비서장으로 해방까지 실무를 총괄했다. 광복 직후 충칭에서 서거."}, {"id": "P152", "name": "조완구", "aliases": "우천", "birth": "1881", "death": "1955", "birthplace": "서울", "faction": "임시정부", "award": "대통령장", "defYear": "", "defType": "", "note": "내무장·재무장 — 납북", "bio": "대종교인으로 1918년 상해로 건너가 임정 수립에 참여했다. 내무장·재무장 등을 역임하고 1940년 한독당 재건과 광복군 창설에 참여했다. 한국전쟁 중 납북되어 사망했다."}, {"id": "P153", "name": "엄항섭", "aliases": "일파", "birth": "1898", "death": "1962", "birthplace": "경기 여주", "faction": "임시정부", "award": "독립장", "defYear": "", "defType": "", "note": "김구 최측근 — 선전부장. 납북", "bio": "1919년 9월 5일 임정 법무부 참사로 임명된(공보 2호) 초기 멤버이자 김구의 최측근. 한독당 조직·선전 책임과 임정 선전부장(1944)을 맡았고, 해방 후 김구 명의 성명 대부분을 기초했다. 남북협상 수행 후 한국전쟁 중 납북됐다."}, {"id": "P154", "name": "김붕준", "aliases": "당헌", "birth": "1888", "death": "1950", "birthplace": "평남 용강", "faction": "임시정부", "award": "대통령장", "defYear": "", "defType": "", "note": "국무위원·제15대 의정원 의장 — 1989 대통령장. 몰년 1950은 납북 추정(공훈전산 미상)", "bio": "청년학우회 출신으로 임정 수립에 참여했다. 상해 인성학교와 임정 기관지 운영을 맡았고 국무위원과 제15대 임시의정원 의장을 역임했다. 해방 후 좌우합작위원회 우측 대표, 1950년 납북 중 사망."}, {"id": "P155", "name": "전덕기", "aliases": "", "birth": "1876", "death": "1914", "birthplace": "서울", "faction": "종교(기독교)", "award": "독립장", "defYear": "", "defType": "", "note": "상동교회 목사 — 신민회 재무", "bio": "상동교회 담임목사. 1907년 신민회 창건위원 7인 중 한 사람으로 재무를 맡았고 상동교회를 신민회 상동파의 거점으로 만들었다. 105인 사건 고문 , "birthplace": "경남 밀양", "faction": "기타", "award": "미서훈", "defYear": "1920", "defType": "논란(미확정)", "note": "일합사→삼광상회 — '구영필 문제'. 미서훈(4회 거부 — 신민부 중심 정사와 상충 사유). 1926.9.11 신민부 문우천에게 피살", "bio": "밀양 일합사(1913) 출신으로 봉천에서 삼광상회를 운영하며 임정 재무부 위원을 지냈다. 김영범(2017)은 1920년 진영사건에서 경부 김태석의 공작에 동원·협력했다고 판정 — 단 '밀정' 단정은 실증 안 된 의혹으로 유보. 유족의 서훈 신청은 1962년 결정 직전 취소됐다."}, {"id": "P194", "name": "고인덕", "aliases": "", "birth": "1887", "death": "1926", "birthplace": "경남 밀양", "faction": "의열투쟁", "award": "독립장", "defYear": "", "defType": "", "note": "밀양경찰서 투탄 폭탄 제작·제공 — 1963 독립장(공훈록 관리번호 148). 1887.11.3–1926.12.21 대구형무소 옥중 순국(심장병)", "bio": "동화학교 출신. 국외 망명 시절 폭탄제조법을 익혔고, 이종암·김상윤의 소개로 의열단에 가입해 밀양 외곽 산속에서 밀양경찰서 투탄용 폭탄을 직접 제작했다(전성현 2011)."}, {"id": "P195", "name": "윤치형", "aliases": "", "birth": "1893", "death": "1970", "birthplace": "경남 밀양", "faction": "의열투쟁", "award": "애국장", "defYear": "", "defType": "", "note": "윤세주 사촌 — 밀양 3·13 만세 공동 주도, 자금 조달, 징역 5년. 1990 애국장(민백 — 1963 표창→1977 건국포장 경유)", "bio": "윤세주의 사촌형제로 밀양 3·1운동을 함께 주도했다. 1차 거사 자금 1천원 조달을 맹세했고 판결문에서 징역 5년을 받았다. 1962-63년 회고로 '구영필 문제'의 핵심 증언을 남겼다."}, {"id": "P196", "name": "전홍표", "aliases": "", "birth": "1869", "death": "1929", "birthplace": "경남 밀양", "faction": "언론·교육", "award": "건국포장", "defYear": "", "defType": "", "note": "동화학교 교장 — 의열단의 스승(제자 윤세주·윤치형·최수봉, 김원봉은 통설). 2018 건국포장(경남교육청 자료) · 몰일 이설: 공훈록 1929.8.11 vs 경남교육청 7.7", "bio": "밀양 동화학교 설립자·교장. 김원봉·윤세주·최수봉·김상윤 등 의열단 창립 세대를 길러낸 민족교육의 고리(전성현 2011)."}, {"id": "P197", "name": "최천택", "aliases": "", "birth": "1897", "death": "1962", "birthplace": "부산", "faction": "의열투쟁", "award": "애족장", "defYear": "", "defType": "", "note": "박재혁 의형제 — 거사 동행. 2003 애족장(공훈록 90834). 생몰 공훈록 1897.6.1–1962.11.17(부산시 인물DB는 1896–1961). 공적: 1923~ 의열단원, 신간회 부산지회 부회장(1927)→지회장(1929)", "bio": "박재혁·오택과 결의형제. 구세단(1914)을 함께 조직했고, 부산경찰서 투탄 전일 용두산공원에서 대상을 확정하고 당일 전차로 동행했다. 해방 후까지 박재혁의 노모를 모셨다."}, {"id": "P198", "name": "오택", "aliases": "오재영", "birth": "1897", "death": "1948", "birthplace": "부산", "faction": "의열투쟁", "award": "애족장", "defYear": "", "defType": "", "note": "박재혁 의형제 — 폭탄 보관. 본명 오재영(吳哉泳). 1990 애족장(인명사전). 구세단 재정 담당 출신", "bio": "박재혁·최천택과 결의형제. 부산경찰서 투탄용 폭탄을 자택에 보관했고, 그의 유고가 부산 의열투쟁 재구성의 핵심 사료다(전성현 2011)."}, {"id": "P199", "name": "이병철", "aliases": "", "birth": "1887", "death": "1925", "birthplace": "경남 밀양", "faction": "의열투쟁", "award": "애국장", "defYear": "", "defType": "", "note": "안동현 원보상회(미곡점) — 의열단 전담연락책, 무기 밀송 2차 완수(인명사전). 1995 애국장. 1925.2.1 사망", "bio": "안동현 원보상회 주인으로 상해-국내 연락·운송을 맡았다. 1·2차분 폭탄을 고량 가마니로 위장해 밀양·부산으로 반입시켰다(판결문 CJA0000271)."}, {"id": "P200", "name": "김병환", "aliases": "", "birth": "1889", "death": "1947", "birthplace": "경남 밀양", "faction": "의열투쟁", "award": "애국장", "defYear": "", "defType": "", "note": "밀양 미곡상 — 폭탄 은닉, 징역 3년. 1991 애국장(공훈록·민백, 1963 표창). 1919.3.13 밀양 만세 주도(6월형), 신간회 밀양지회 부회장", "bio": "밀양 시장의 미곡상. 1차분 폭탄 3개를 점포에 은닉했다가 징역 3년을 받았다(판결문). 그의 상점은 밀양 3·1운동의 구심이기도 했다."}, {"id": "P201", "name": "배중세", "aliases": "", "birth": "1893", "death": "1944", "birthplace": "경남 창원", "faction": "의열투쟁", "award": "애국장", "defYear": "", "defType": "", "note": "진영 폭탄 은닉, 징역 2년. 1990 애국장. 생년 공훈록 1893.3.5 채택(인명사전 1895.12.18 이설). 조선국권회복단 마산지부 출신 — 1943 예비검속, 1944.1.23 대구형무소 옥사", "bio": "대동청년단·조선국권회복단 출신. 2차분 폭탄을 진영역 근처에 은닉했다가 징역 2년(판결문). 통설 창립단원 '배동선'과의 혼동 문제가 있음(김영범 2017은 배동선 창립단원설 부정)."}, {"id": "P202", "name": "이수택", "aliases": "이일몽", "birth": "1891", "death": "1927", "birthplace": "경남 밀양", "faction": "의열투쟁", "award": "애국장", "defYear": "", "defType": "", "note": "폭탄 관리책 — 결행 지연의 핵심. 1990 애국장(공훈록 관리번호 4902, 의열투쟁). 1891.2.17–1927.7.4(공적개요 내 순국일 1927.6.6 병존 — 음양력 차 추정). 광복단(1913) 출신, 고문 여독 순국", "bio": "광복단 출신 1차 거사 폭탄 관리책. 김원봉의 결행 독촉에도 폭탄을 내주지 않아 투탄이 거듭 지연됐다(김영범 2017 — '구영필그룹'으로 끌려들어간 정황). 창립 단원은 아닌 조력자 그룹."}, {"id": "P203", "name": "장건상", "aliases": "소해", "birth": "1882", "death": "1974", "birthplace": "경북 칠곡", "faction": "임시정부", "award": "대통령장", "defYear": "", "defType": "", "note": "임정 외무차장 — 폭탄 소포 발송 명의. 1986 대통령장. 의열단 고문·1차 계획 폭탄 반입 연락 주선(위키 — 판결문 소포 건과 부합)", "bio": "임시정부 외무차장. 1차 const FACTION_KEY = f => {
  if (!f) return '기타';
  if (f.startsWith('종교')) return '종교';
  if (f === '외교·구미') return '외교구미';
  if (f === '언론·교육') return '언론교육';
  if (['임시정부','의열투쟁','만주무장투쟁','사회주의','여성운동','아나키즘'].includes(f)) return f;
  return '기타';
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const factionColor = f => css('--c-' + FACTION_KEY(f)) || css('--c-기타');

const persons = Object.fromEntries(DATA.persons.map(p => [p.id, p]));
const orgs    = Object.fromEntries(DATA.orgs.map(o => [o.id, o]));
const events  = Object.fromEntries(DATA.events.map(v => [v.id, v]));
const S = DATA.sources;
const num = s => s ? parseInt(s, 10) : NaN;
const eStart = e => { const n = num(e.start); return isNaN(n) ? 0 : n; };
const eEnd   = e => { const n = num(e.end);   return isNaN(n) ? 9999 : n; };
const isEvt  = id => id.startsWith('V');

// 인물별 최초 기록 활동 연도 — '아직 등장 전'과 '기록 공백'을 구분하는 기준
const firstAct = {};
DATA.edges.forEach(e => {
  [e.src, e.tgt].forEach(id => {
    if (!persons[id]) return;
    const s = num(e.start);
    if (!isNaN(s)) firstAct[id] = Math.min(firstAct[id] || 9999, s);
  });
});

let mode = { type: 'all', focus: null, trail: [] };
// 시간 모드: 'range'(기본, 1895~1945 전체 = 사실상 전체 보기) | 'snap'(그 해의 스냅샷)
let timeMode = 'range', Y = 1919, R1 = 1895, R2 = 1945;
const loCut = () => timeMode === 'snap' ? Y : R1;   // 사망(묘비) 판정 기준
const hiCut = () => timeMode === 'snap' ? Y : R2;   // 등장(반투명) 판정 기준

function nodeSpec(id, dimmed) {
  const base = { id, font: { face: "'IBM Plex Sans KR', sans-serif", color: css('--ink'), size: 13 } };
  if (persons[id]) {
    const p = persons[id];
    const col = factionColor(p.faction);
    const life = (p.birth||'?') + '–' + (p.death||'?');
    return Object.assign(base, {
      label: p.name, shape: 'dot',
      color: { background: col, border: col },
      title: `${p.name}${p.aliases ? ' ('+p.aliases.replace(/;/g,'·')+')' : ''} · ${life}\n${p.faction} · ${p.award}${p.defYear ? '\n⚠ '+p.defYear+' '+p.defType : ''}`,
      opacity: dimmed ? 0.25 : 1
    });
  }
  if (orgs[id]) {
    const o = orgs[id];
    const col = factionColor(o.faction);
    return Object.assign(base, {
      label: o.name, shape: 'box', margin: 8, shapeProperties: { borderRadius: 3 },
      color: { background: css('--panel2'), border: col },
      borderWidth: 2.5,
      font: { face: "'Gowun Batang', serif", color: css('--ink'), size: 13.5 },
      title: `${o.name} (${o.founded||'?'}–${o.dissolved||'현존/미상'}) · ${o.faction}`,
      opacity: dimmed ? 0.25 : 1
    });
  }
  const v = events[id];
  return Object.assign(base, {
    label: v.name, shape: 'diamond', size: 11,
    color: { background: css('--c-사건'), border: css('--c-사건') },
    font: { color: css('--ink2'), size: 11.5 },
    title: `${v.name} · ${v.date} · ${v.place}`,
    opacity: dimmed ? 0.25 : 1
  });
}

function edgeSpec(e) {
  // fA = 기록으로 확인된 마지막 연도. e.att가 없으면: end가 있으면 end, 없으면 시작 연도만 확인된 것
  const attN = num(e.att);
  const fA = !isNaN(attN) ? attN : (num(e.end) ? eEnd(e) : eStart(e));
  const spec = {
    id: e.id, from: e.src, to: e.tgt, fS: eStart(e), fE: eEnd(e), fA,
    color: { color: css('--line'), highlight: css('--accent'), opacity: 0.85 },
    width: 1.4, smooth: { type: 'continuous' },
    title: `${e.rel} (${e.start||'?'}–${e.end||'…'})${e.endReason ? ' · 종료: '+e.endReason : ''}\n근거 ${e.ev} · 확신도 ${e.conf}${e.note ? '\n'+e.note : ''}`
  };
  if (e.dir === 'Y' && !e.rel.startsWith('소속') && !e.rel.startsWith('사건') && !e.rel.startsWith('산하'))
    spec.arrows = { to: { enabled: true, scaleFactor: 0.6 } };
  if (e.rel.startsWith('혈연')) { spec.color.color = css('--c-여성운동'); spec.width = 2; }
  if (e.rel === '노선대립' || e.rel === '밀고·배신') { spec.color.color = css('--accent'); spec.dashes = [4,4]; }
  if (e.rel === '지시·파견') { spec.color.color = css('--ink2'); spec.width = 1.8; }
  if (e.endReason === '변절') { spec.dashes = [2,4]; spec.color.color = css('--accent'); }
  // 기본 스타일 보관 — 지속 추정 구간에서 흐려졌다 복원할 때 사용
  spec.bDash = spec.dashes || false;
  spec.bCol = spec.color.color;
  spec.bOp = spec.color.opacity ?? 0.85;
  spec.bW = spec.width;
  return spec;
}

function scopeEdges(includeEvents) {
  return DATA.edges.filter(e => includeEvents || (!isEvt(e.src) && !isEvt(e.tgt)));
}

// 연도와 무관하게 그래프를 통째로 짓고, 연도 필터는 applyYear()가 hidden 토글로만 처리
function buildAll() {
  const incEv = document.getElementById('tgEvents').checked;
  const es = scopeEdges(incEv);
  const ids = new Set();
  es.forEach(e => { ids.add(e.src); ids.add(e.tgt); });
  DATA.persons.forEach(p => ids.add(p.id));   // 미연결 인물도 넣고 hidden으로 제어
  if (!incEv) [...ids].forEach(id => { if (isEvt(id)) ids.delete(id); });
  return {
    nodes: [...ids].map(id => nodeSpec(id, false)),
    edges: es.map(edgeSpec)
  };
}

function overlap(a1, a2, b1, b2) { const s = Math.max(a1, b1), t = Math.min(a2, b2); return s <= t ? [s, t] : null; }

function buildEgo(focus) {
  const incEv = document.getElementById('tgEvents').checked;
  const es = scopeEdges(true).filter(e => e.src === focus || e.tgt === focus);
  const ids = new Set([focus]);
  const edges = [];
  es.forEach(e => {
    const other = e.src === focus ? e.tgt : e.src;
    if (isEvt(other) && !incEv && !persons[focus]) return;
    ids.add(other); edges.push(edgeSpec(e));
  });
  // 파생: 같은 단체/사건 공유 (시기 겹침) — 인물 포커스일 때
  if (persons[focus]) {
    const shared = {};
    es.forEach(e1 => {
      const mid = e1.src === focus ? e1.tgt : e1.src;
      if (persons[mid]) return;
      DATA.edges.filter(e2 => e2 !== e1 && (e2.src === mid || e2.tgt === mid)).forEach(e2 => {
        const q = e2.src === mid ? e2.tgt : e2.src;
        if (!persons[q] || q === focus) return;
        const ov = overlap(eStart(e1), eEnd(e1), eStart(e2), eEnd(e2));
        if (!ov) return;
        const rec = shared[q] = shared[q] || { names: [], s: 9999, t: 0 };
        rec.names.push((orgs[mid] || events[mid]).name);
        rec.s = Math.min(rec.s, ov[0]); rec.t = Math.max(rec.t, ov[1]);
      });
    });
    Object.entries(shared).forEach(([q, rec], i) => {
      ids.add(q);
      const uniq = [...new Set(rec.names)];
      edges.push({
        id: 'D' + i, from: focus, to: q, fS: rec.s, fE: rec.t, fA: rec.t,
        bDash: [6,5], bCol: css('--muted'), bOp: 0.55, bW: 1,
        dashes: [6,5], width: 1,
        color: { color: css('--muted'), opacity: 0.55 },
        title: '공유: ' + uniq.join(', ') + ' (시기 겹침 기반 파생 — DB에 없는 계산 관계)'
      });
    });
  }
  return { nodes: [...ids].map(id => nodeSpec(id, false)), edges };
}

const deathY = p => { const m = (p.death || '').match(/\d{4}/); return m ? +m[0] : 9999; };

// 변절 상태: 0 = 변절 전(무죄), 1 = 변절 시점이 조회 구간에 걸침(빨간 테두리),
//            2 = 변절 이후(검정 중심 + 빨간 테두리)
function defState(p) {
  if (!p || !p.defYear) return 0;
  const D = +p.defYear;
  if (timeMode === 'snap') return Y > D ? 2 : (Y === D ? 1 : 0);
  return R1 > D ? 2 : (R2 >= D ? 1 : 0);
}
// 두 색 섞기 — 변절 시점의 '빛바랜' 몸통용 (빨간 계열 인물도 링이 보이게)
function mixHex(a, b, t) {
  const pa = a.match(/\w\w/g).map(x => parseInt(x, 16));
  const pb = b.match(/\w\w/g).map(x => parseInt(x, 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function liveStyle(id) {
  const p = persons[id];
  if (!p) return {};
  const ds = defState(p);
  const col = factionColor(p.faction);
  return {
    color: {
      background: ds === 2 ? '#141414' : (ds === 1 ? mixHex(col, css('--bg'), 0.55) : col),
      border: ds ? css('--accent') : col
    },
    borderWidth: ds ? 3 : 1, opacity: 1,
    font: { face: "'IBM Plex Sans KR', sans-serif", color: css('--ink'), size: 13 }
  };
}
function ghostStyle(p) {
  const ds = defState(p);
  return {
    color: { background: ds === 2 ? '#141414' : css('--bg'), border: ds ? css('--accent') : css('--muted') },
    borderWidth: ds ? 3 : 2, opacity: 0.8,
    font: { face: "'IBM Plex Sans KR', sans-serif", color: css('--muted'), size: 12 }
  };
}

function applyYear() {
  const incIso = document.getElementById('tgIso').checked;
  const seen = {};
  const updE = [];
  const ref = timeMode === 'snap' ? Y : R1;
  edgesDS.forEach(e => {
    const v = timeMode === 'snap' ? (e.fS <= Y && e.fE >= Y) : (e.fS <= R2 && e.fE >= R1);
    const upd = { id: e.id, hidden: !v };
    if (v) {
      // 확인된 구간(fA) 이후 = 기록상 끝 불명, 지속 추정 — 흐린 점선
      const guessing = ref > e.fA && e.fA < e.fE;
      upd.dashes = guessing ? [2,6] : (e.bDash || false);
      upd.width = guessing ? 1 : e.bW;
      upd.color = { color: e.bCol, highlight: css('--accent'), opacity: guessing ? 0.3 : e.bOp };
      seen[e.from] = 1; seen[e.to] = 1;
    }
    updE.push(upd);
  });
  edgesDS.update(updE);
  const fadedStyle = id => {
    const st = liveStyle(id);
    st.opacity = 0.3;
    st.font = { face: "'IBM Plex Sans KR', sans-serif", color: css('--muted'), size: 12 };
    return st;
  };
  const updN = [];
  nodesDS.forEach(n => {
    const p = persons[n.id];
    const connected = seen[n.id] || (mode.type === 'ego' && n.id === mode.focus);
    const isolated = p && !firstAct[n.id];   // 기록된 관계가 0건인 인물 — 토글로만 등장
    if (connected) {
      updN.push(Object.assign({ id: n.id, hidden: false }, liveStyle(n.id)));
    } else if (isolated) {
      // 등장한 적 없는 인물은 죽어도 묘비를 세우지 않는다 — 토글 켜면 상태별 스타일로
      if (mode.type === 'all' && incIso) {
        const st = deathY(p) < loCut() ? ghostStyle(p) : fadedStyle(n.id);
        updN.push(Object.assign({ id: n.id, hidden: false }, st));
      } else {
        updN.push({ id: n.id, hidden: true });
      }
    } else if (p && firstAct[n.id] <= hiCut() && deathY(p) < loCut()) {
      // 활동 등장 이후 + 시점 이전 사망 — 회색 빈 원(묘비)
      updN.push(Object.assign({ id: n.id, hidden: false }, ghostStyle(p)));
    } else if (p && firstAct[n.id] <= hiCut()) {
      // 생존 중이지만 이 시기에 기록된 관계 없음 — 반투명(조사 공백)
      updN.push(Object.assign({ id: n.id, hidden: false }, fadedStyle(n.id)));
    } else {
      updN.push({ id: n.id, hidden: true });   // 아직 활동 시작 전
    }
  });
  nodesDS.update(updN);
  updateOrgRail();
}

// ── 단체 연표 레일 ──
const T0 = 1895, T1 = 1945;
const orgY = (o, k, d) => { const m = (o[k] || '').match(/\d{4}/); return m ? +m[0] : d; };
function buildOrgRail() {
  const list = document.getElementById('orgList');
  const sorted = [...DATA.orgs].sort((a, b) => orgY(a,'founded',9999) - orgY(b,'founded',9999));
  list.innerHTML = sorted.map(o => {
    const f = orgY(o,'founded',T0), d = orgY(o,'dissolved',T1);
    const l = Math.max(0, (f - T0) / (T1 - T0) * 100);
    const w = Math.max(2, (Math.min(d, T1) - Math.max(f, T0)) / (T1 - T0) * 100);
    return `<div class="org-item" data-org="${o.id}" data-f="${f}" data-d="${d}">
      <div class="nm"><span>${o.name}</span><span class="yrs2">${o.founded || '?'}–${o.dissolved || ''}</span></div>
      <div class="track"><span class="span" style="left:${l}%;width:${w}%;background:${factionColor(o.faction)}"></span></div>
    </div>`;
  }).join('');
  list.querySelectorAll('.org-item').forEach(el => el.onclick = () => focusNode(el.dataset.org));
}
function updateOrgRail() {
  document.querySelectorAll('.org-item').forEach(el => {
    const f = +el.dataset.f, d = +el.dataset.d;
    const on = timeMode === 'snap' ? (f <= Y && d >= Y) : (f <= R2 && d >= R1);
    el.classList.toggle('off', !on);
  });
}

const container = document.getElementById('net');
const nodesDS = new vis.DataSet([]);
const edgesDS = new vis.DataSet([]);
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    barnesHut: { gravitationalConstant: -4200, springLength: 140, springConstant: 0.01, avoidOverlap: 0.2, damping: 0.65 },
    stabilization: { iterations: 250, fit: true }
  },
  interaction: { hover: true, tooltipDelay: 120 },
  nodes: { scaling: { min: 8, max: 26 } },
  edges: { selectionWidth: 1.5 }
});

// 물리는 계속 살려둔다(옵시디언식 유동감) — 대신 감쇠를 높여서 출렁이지 않고 흘러가게.
function degreeSize() {
  const deg = {};
  edgesDS.forEach(e => { deg[e.from] = (deg[e.from]||0)+1; deg[e.to] = (deg[e.to]||0)+1; });
  nodesDS.forEach(n => {
    if (persons[n.id]) nodesDS.update({ id: n.id, size: Math.min(9 + (deg[n.id]||0) * 1.7, 26) });
  });
}

function render() {
  const g = mode.type === 'all' ? buildAll() : buildEgo(mode.focus);
  network.setOptions({ physics: { enabled: true } });   // 재배치 동안만 켰다가 stabilized에서 끔
  nodesDS.clear(); edgesDS.clear();
  nodesDS.add(g.nodes); edgesDS.add(g.edges);
  degreeSize();
  applyYear();
  network.fit({ animation: false });
  renderCrumb();
}

function renderCrumb() {
  const el = document.getElementById('crumb');
  if (mode.type === 'all') { el.innerHTML = '<span>전체 뷰 — 인물(원)·단체(상자). 노드를 클릭하면 그 중심의 관계로 들어갑니다.</span>'; return; }
  const parts = mode.trail.map((id, i) =>
    `<a data-i="${i}">${(persons[id]||orgs[id]||events[id]).name}</a>`).join(' › ');
  el.innerHTML = `<a data-i="-1">전체</a> › ${parts}`;
  el.querySelectorAll('a').forEach(a => a.onclick = () => {
    const i = +a.dataset.i;
    if (i < 0) { mode = { type: 'all', focus: null, trail: [] }; }
    else { mode = { type: 'ego', focus: mode.trail[i], trail: mode.trail.slice(0, i+1) }; }
    render(); renderPanel(mode.focus);
  });
}

const REL_KO = r => r;
function renderPanel(id) {
  const el = document.getElementById('panel');
  const legend = `
  <div class="legend">
    ${[['임시정부','임시정부'],['의열투쟁','의열투쟁'],['만주무장투쟁','만주·연해주'],['종교','종교'],
       ['사회주의','사회주의'],['여성운동','여성운동'],['외교구미','외교·구미'],['언론교육','언론·교육'],
       ['아나키즘','아나키즘'],['기타','기타·비밀결사']].map(([k,l]) =>
       `<span class="chip"><span class="dot" style="background:var(--c-${k})"></span>${l}</span>`).join('')}
    <span class="chip"><span class="sq" style="background:var(--c-사건);transform:rotate(45deg)"></span>사건</span>
    <span class="chip"><span class="dot" style="background:transparent;border:1.5px solid var(--muted)"></span>사망(시점 이후)</span>
    <span class="chip"><span class="dot" style="background:var(--muted);opacity:.35"></span>생존·기록 공백</span>
    <span class="chip"><span class="dot" style="background:color-mix(in srgb, var(--c-의열투쟁) 45%, var(--bg));border:2px solid var(--accent)"></span>변절 시점(색 바램)</span>
    <span class="chip"><span class="dot" style="background:#141414;border:2px solid var(--accent)"></span>변절 이후</span>
  </div>
  <div class="legend" style="margin-top:-6px">
    <span class="chip"><span class="ln"></span>소속·사건·교류</span>
    <span class="chip"><span class="ln" style="border-color:var(--c-여성운동);border-top-width:3px"></span>혈연·부부</span>
    <span class="chip"><span class="ln" style="border-color:var(--ink2);border-top-width:3px"></span>지시·파견 →</span>
    <span class="chip"><span class="ln" style="border-style:dashed;border-color:var(--accent)"></span>대립·배신</span>
    <span class="chip"><span class="ln" style="border-style:dotted;border-color:var(--accent)"></span>변절로 끊김</span>
    <span class="chip"><span class="ln" style="border-style:dashed;border-color:var(--muted)"></span>파생(단체·사건 공유)</span>
    <span class="chip"><span class="ln" style="border-style:dotted;border-color:var(--line);opacity:.6"></span>끝 불명 — 지속 추정 구간</span>
  </div>`;
  if (!id) {
    el.innerHTML = legend + `
      <h2>관계망 읽는 법</h2>
      <div class="meta" style="margin-top:8px">
        원 = 인물(계열 색), 상자 = 단체, 마름모 = 사건.<br>
        인물을 클릭하면 <b>그 사람 중심의 관계</b>로 전환 — 실선은 DB에 기록된 관계, <b>점선은 같은 단체·사건을
        시기가 겹치게 공유한 파생 관계</b>(저장 안 됨, 계산됨).<br><br>
        <b>범위 모드</b>(기본)는 서사시용 — 시작 연도를 끌어올리면 떠난 이들의 빈 원이 쌓임.
        1895~1945 전체로 펴면 모든 기록이 다 보임.
        <b>스냅샷 모드</b>는 정밀 조회용 — 슬라이더가 가리키는 그 해의 판만 남음.
        왼쪽 단체 연표에서 단체를 클릭하면 바로 그 단체 중심으로 이동.
      </div>
      <div class="note-box">모든 관계는 확실도와 근거를 달고 있습니다. <b>A</b> 판결문·신문조서·공보·실물 등 1차 사료 원문 확인 / <b>B</b> 백과사전·인명사전·공훈록·학술 논문 / <b>C</b> 회고·통설 수준(근거 약함). 관계 목록의 근거 메모에서 출처를 확인할 수 있습니다.</div>`;
    return;
  }
  const n = persons[id] || orgs[id] || events[id];
  let head = '';
  if (persons[id]) {
    const p = n;
    head = `<h2>${p.name} <span style="font-size:12px;color:var(--muted)">${p.aliases ? p.aliases.replace(/;/g,' · ') : ''}</span></h2>
    <div class="meta">
      <b>${p.birth || '?'}–${p.death || '?'}</b> · ${p.birthplace || '출신 미상'}<br>
      계열 <b style="color:${factionColor(p.faction)}">${p.faction}</b> · 서훈 ${
        ['미서훈','서훈취소'].includes(p.award) ? `<span class="badge def">${p.award}</span>` : '<b>'+p.award+'</b>'}
      ${p.defYear ? `<br><span class="badge def">변절 ${p.defYear} · ${p.defType}</span>` : ''}
      ${p.note ? `<br>${p.note}` : ''}
    </div>`;
  } else if (orgs[id]) {
    head = `<h2>${n.name}</h2><div class="meta"><b>${n.founded || '?'}–${n.dissolved || '현존/미상'}</b> · ${n.faction}${n.note ? '<br>'+n.note : ''}</div>`;
  } else {
    head = `<h2>${n.name}</h2><div class="meta"><b>${n.date}</b> · ${n.place}${n.note ? '<br>'+n.note : ''}</div>`;
  }
  const bio = (persons[id] || orgs[id] || {}).bio;
  if (bio) head += `<div class="bio">${bio}<span class="tag">— 요약 소개 · 근거는 아래 관계 목록 참조</span></div>`;
  const rel = DATA.edges.filter(e => e.src === id || e.tgt === id);
  const items = rel.map(e => {
    const other = e.src === id ? e.tgt : e.src;
    const on = (persons[other] || orgs[other] || events[other]).name;
    const arrow = e.dir === 'Y' ? (e.src === id ? '→' : '←') : '·';
    return `<div class="edge-item">
      <span class="rel">${REL_KO(e.rel)}</span> ${arrow} <a style="color:var(--accent);cursor:pointer" data-go="${other}">${on}</a>
      <span class="yrs">${e.start || '?'}–${e.end || '…'}</span>
      <span class="conf ${e.conf}">${e.conf}</span>${e.endReason ? ` <span class="yrs">(${e.endReason})</span>` : ''}
      ${e.note ? `<br>${e.note}` : ''}<br><span class="src">${S[e.ev] ? S[e.ev].cite : e.ev}</span>
    </div>`;
  }).join('');
  el.innerHTML = legend + head + `<h3>기록된 관계 ${rel.length}건</h3>` + (items || '<div class="hint">기록된 관계 없음</div>');
  el.querySelectorAll('[data-go]').forEach(a => a.onclick = () => focusNode(a.dataset.go));
}

function focusNode(id) {
  if (mode.type === 'ego' && mode.focus === id) { renderPanel(id); return; }  // 같은 노드 재클릭 무시
  const trail = [...(mode.trail || [])];
  const i = trail.indexOf(id);
  if (i >= 0) trail.length = i;   // 이미 지나온 노드면 그 지점으로 되감기
  trail.push(id);
  mode = { type: 'ego', focus: id, trail: trail.slice(-6) };
  render(); renderPanel(id);
}

network.on('click', params => {
  if (params.nodes.length) focusNode(params.nodes[0]);
});

// 컨트롤 — 시간 모드 전환
const $ = id => document.getElementById(id);
function setTimeMode(m) {
  timeMode = m;
  $('mRange').classList.toggle('primary', m === 'range');
  $('mSnap').classList.toggle('primary', m === 'snap');
  $('rangeCtl').hidden = m !== 'range';
  $('snapCtl').hidden = m !== 'snap';
  applyYear();   // 재배치 없이 제자리에서 숨김/표시만
}
$('mRange').onclick = () => setTimeMode('range');
$('mSnap').onclick = () => setTimeMode('snap');
$('yr').oninput = () => { Y = +$('yr').value; $('yrv').textContent = Y; applyYear(); };
function rangeChange() {
  const a = +$('r1').value, b = +$('r2').value;
  R1 = Math.min(a, b); R2 = Math.max(a, b);
  $('r1v').textContent = R1; $('r2v').textContent = R2;
  applyYear();
}
$('r1').oninput = $('r2').oninput = rangeChange;
document.getElementById('tgEvents').onchange = render;
document.getElementById('tgIso').onchange = applyYear;
document.getElementById('reset').onclick = () => { mode = { type: 'all', focus: null, trail: [] }; render(); renderPanel(null); };

const dl = document.getElementById('names');
[...DATA.persons, ...DATA.orgs].forEach(x => { const o = document.createElement('option'); o.value = x.name; dl.appendChild(o); });
document.getElementById('q').addEventListener('change', ev => {
  const hit = [...DATA.persons, ...DATA.orgs].find(x => x.name === ev.target.value ||
    (x.aliases || '').split(';').includes(ev.target.value));
  if (hit) focusNode(hit.id);
});

// 테마 변화 시 색 갱신
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { render(); renderPanel(mode.focus); });

buildOrgRail();
document.getElementById('stats').textContent =
  `인물 ${DATA.persons.length} · 단체 ${DATA.orgs.length} · 사건 ${DATA.events.length} · 관계 ${DATA.edges.length}`;
render(); renderPanel(null);
</script>
