<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Projects | VODA</title>

  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
  <script src="script.js" defer></script>
  <script src="content.js?v=20261010-clean-copy" defer></script>
</head>

<body class="projects-page">
  <header id="site-header" class="site-header"></header>

  <main>
    <!-- 얇은 상단 배너 -->
    <section class="projects-banner">
      <div class="wrap">
        <h1>Projects</h1>
      </div>
    </section>

    <div class="wrap projects-content">

      <!-- 페이지 내부 탭 -->
      <div class="projects-tabs" aria-label="프로젝트 메뉴">
        <button
          type="button"
          class="projects-tab active"
          data-project-tab="list"
        >
          프로젝트
        </button>

        <button
          type="button"
          class="projects-tab"
          data-project-tab="analysis"
        >
          독립운동가 관계망
        </button>
      </div>

      <!-- 프로젝트 목록 -->
      <section
        data-project-panel="list"
        aria-label="프로젝트 목록"
      >
        <div class="projects-grid" id="managed-projects"></div>
        <article class="project-report-card">
          <span class="project-category">연구 보고서</span>
          <h2>안동 내앞마을 및 풍산 일대 사회주의 계열 독립운동의 재조명과 서훈 과제</h2>
          <p>혁신 유림과 독립운동 노선의 변화, 신간회 안동지회, 독립운동가의 서훈 과제를 살펴본 보고서입니다.</p>
          <div class="project-report-links">
            <a href="/analysis/reports/andong/">보고서 읽기 →</a>
            <a href="/analysis/reports/andong/report.docx" download>Word 다운로드</a>
          </div>
        </article>
        </section>

      <!-- 독립유공자 분석 탭 -->
      <section
        data-project-panel="analysis"
        aria-label="독립운동가 관계망"
        hidden
      >
        <p class="project-analysis-actions"><a href="analysis/" target="_blank" rel="noopener noreferrer">관계망을 새 탭에서 크게 보기 ↗</a></p>
        <iframe class="project-analysis-frame" src="analysis/"
          title="독립운동가 관계망" sandbox="allow-scripts allow-downloads" loading="lazy"></iframe>
      </section>

    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
